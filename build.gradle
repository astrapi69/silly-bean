buildscript {
    repositories {
        maven {
            url = projectRepositoriesMavenUrl
        }
    }
}

plugins {
    id 'jacoco'
    id 'java'
    id 'java-library'
    id 'maven-publish'
    id 'signing'
    alias(libs.plugins.gradle.versions.plugin)
    alias(libs.plugins.nmcp.gradle.plugin)
    alias(libs.plugins.pitest.gradle.plugin)
    alias(libs.plugins.spotless.plugin.gradle)
    alias(libs.plugins.test.results.complete)
    alias(libs.plugins.version.catalog.update)
}

group = "$groupPackage" as Object
version = "$projectVersion" as Object
description = "$rootProject.name"

// import gradle files
apply from: "gradle/apply-gradle-files.gradle"

// Mutation-score floor the workflow "Mutation testing" fails below: it runs `./gradlew pitest` on
// GitHub (.github/workflows/mutation-testing.yml, #19); PIT rounds the score half up to a whole
// percent before it compares, and holds it at 99 while a mutant survives. Measured 99 % (338 of 342
// mutants detected) on 2026-11-06, after the parameterized tests of 4.0 (#33; run 42200070419 on the
// tree of develop b681a29), up from 42 % (145 of 342) when the floor was set at 40 (#19). The four
// survivors are equivalent: they change only the initial capacity of the LinkedHashSet in
// KeySetPair.KeySetPairBuilder.build() (#32). The floor is that score minus about two points,
// rounded down: a few mutants more that survive, such as those of a new method whose tests are not
// complete yet, do not fail the run at once, a drop of more than about two points does. With the 342
// mutants of today it fails from 8 more survivors on: 330 of 342 is 96.5 %, which PIT rounds to 96.
// Kept here, not in gradle/mutation-testing.gradle, so that the floor sits in the file a reader
// (and awesome-well-tested's check) looks at.
pitest {
    mutationThreshold = 97
}

java {
    sourceCompatibility = "$projectSourceCompatibility" as Object
    toolchain {
        languageVersion = JavaLanguageVersion.of("$projectSourceCompatibility")
    }
}

tasks.withType(JavaCompile).configureEach { javaCompiler ->
    options.encoding = "UTF-8"
    // --release records the feature release of java.base in module-info.class (requires java.base 25), where
    // javac would otherwise write the version of the JDK it runs on (25.0.5), and the jar would differ with
    // the JDK's patch level (#24, as astrapi69/silly-collection#99)
    options.release = Integer.parseInt("$projectSourceCompatibility")
    // uncomment the next line for build with compiler argument -Xlint:deprecation
    // options.compilerArgs << "-Xlint:deprecation"
    // uncomment the next line for build with compiler argument -Xlint:unchecked
    // options.compilerArgs << "-Xlint:unchecked"
}
