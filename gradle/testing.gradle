
test {
    useJUnitPlatform()
}

jacocoTestReport {
    reports {
        xml.required.set(true)
        html.required.set(true)
    }
}

// Coverage floor the build fails below (#19). Measured on 2026-11-06 (develop c792212, Temurin 25.0.5+8):
// 477 of 544 lines, 87.7 %, and 142 of 260 branches, 54.6 %. The floor is each measure minus about two
// points, rounded down, as for the mutation score in build.gradle: a few lines or branches that a new
// method's tests do not reach yet do not fail the build at once, a drop of more than about two points does.
// With the 544 lines of today it fails from 15 more missed lines on, with the 260 branches from 7 more.
jacocoTestCoverageVerification {
    violationRules {
        rule {
            limit {
                counter = 'LINE'
                value = 'COVEREDRATIO'
                minimum = 0.85
            }
            limit {
                counter = 'BRANCH'
                value = 'COVEREDRATIO'
                minimum = 0.52
            }
        }
    }
}

jacocoTestCoverageVerification.dependsOn test
check.dependsOn jacocoTestReport
check.dependsOn jacocoTestCoverageVerification
